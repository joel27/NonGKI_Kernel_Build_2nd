name: Xiaomi 11U — Prueba HyperOS

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: 'LD=ld.lld LLVM=1 LLVM_IAS=1 EXTRA_CFLAGS="-Wno-unused-function -Wno-frame-larger-than"'

  KERNEL_SOURCE: "https://github.com/joel27/android_kernel_xiaomi_sm8350-hyperos.git"
  KERNEL_BRANCH: "dynamic"

  CLANG_SOURCE: "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""

  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "bakasu"

  SUSFS_ENABLE: true
  SUSFS_FIXED: true

  NOMOUNT_ENABLE: "true"

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "Kernel-HyperOS-TechMaster"

  PYTHON_VERSION: "3"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "joel27/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "sysfs_fixed"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  
  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/star_QGKI.config,vendor/xiaomi_QGKI.config"
  
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi11U (HyperOS Modern)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🛠️ Export Clang to PATH safely
        shell: bash
        run: |
          echo "Buscando el binario ejecutable de ld.lld..."
          LD_LFD_PATH=""
          for path in $(find / -name "ld.lld" -type f 2>/dev/null); do
            if [ -x "$path" ] && [[ "$path" != *"/usr/lib/llvm-"* ]] && [[ "$path" != *"/usr/share"* ]]; then
              LD_LFD_PATH="$path"
              break
            fi
          done

          if [ -n "$LD_LFD_PATH" ]; then
            CLANG_BIN=$(dirname "$LD_LFD_PATH")
            echo "✅ Clang bin ejecutable encontrado en: $CLANG_BIN"
            echo "$CLANG_BIN" >> $GITHUB_PATH
            export PATH="$PATH:$CLANG_BIN"
          else
            echo "❌ Error crítico: No se pudo localizar un ld.lld ejecutable válido."
            exit 1
          fi
          ld.lld --version

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🚫 Patch NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🩹 Patch Stock Config
        uses: ./.github/workflows/patch-stock-config

      - name: 🪛 Extra Kernel Options
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          echo "KBUILD_BUILD_TIMESTAMP=Fri Nov 14 08:26:51 UTC 2025" >> $GITHUB_ENV

      - name: 🚀 Build Process with Guaranteed Log Generation
        id: build_step
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          echo "Iniciando configuración del kernel..."
          
          export KBUILD_BUILD_TIMESTAMP="Fri Nov 14 08:26:51 UTC 2025"
          
          # Paso 1: Generar la configuración (defconfig)
          make O=out ARCH=arm64 ${{ env.EXTRA_CMDS }} ${{ env.DEFCONFIG_NAME }}
          
          echo "Configuración escrita. Iniciando compilación masiva..."
          
          # Paso 2: Compilar el kernel y guardar todo el flujo en el log
          if make -j$(nproc) O=out ARCH=arm64 ${{ env.EXTRA_CMDS }} 2>&1 | tee build_full.log; then
            echo "BUILD_STATUS=SUCCESS" >> $GITHUB_ENV
            echo "✅ Compilación exitosa."
          else
            echo "BUILD_STATUS=FAILED" >> $GITHUB_ENV
            echo "--------------------------------------------------------"
            echo "❌ ¡LA COMPILACIÓN HA FALLADO! RESUMEN DE ERRORES:"
            echo "--------------------------------------------------------"
            grep -i -C 3 "error:" build_full.log || true
            echo "--------------------------------------------------------"
            exit 1
          fi

      - name: 📦 Package AnyKernel3 Flash Zip
        if: env.PACK_METHOD == 'AnyKernel3' && env.BUILD_STATUS != 'FAILED'
        shell: bash
        run: |
          set -uo pipefail
          TIME=$(date +"%Y%m%d%H%M%S")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"
          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ Build failed, Image not found"
            exit 1
          fi
          IMG_SIZE=$(du -h "${IMG_PATH}" | awk '{print $1}')
          echo "✅ Kernel image detected | Size: ${IMG_SIZE}"
          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"

          AK3_DIR="${KERNEL_DIR}/AnyKernel3"
          if [[ ! -d "${AK3_DIR}" ]]; then
            echo "::error::❌ AnyKernel3 not found in ${AK3_DIR}"
            exit 1
          fi
          if [[ -d "${AK3_DIR}" ]]; then
            curl -fsSL --retry 3 https://raw.githubusercontent.com/joel27/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o "${AK3_DIR}/anykernel.sh"
            chmod +x "${AK3_DIR}/anykernel.sh"
            sed -i \
              -e 's/^name=.*/name="11U-Bakasu"/' \
              -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
              -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
              -e 's/^BLOCK=.*/BLOCK=boot/' \
              "${AK3_DIR}/anykernel.sh"
          fi

          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"
          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"
          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"

          FINAL_ZIP="Kernel-HyperOS-TechMaster-11U-${TIME}.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> $GITHUB_ENV
          echo "✅ Zip generado: ${FINAL_ZIP}"
          rm -rf "${TMP_DIR}"

      - name: 📝 Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Compilation-Full-Log
          path: device_kernel/build_full.log

      - name: 🚀 Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        if: env.PACK_METHOD == 'AnyKernel3' && env.BUILD_STATUS != 'FAILED'
        with:
          name: Star-Kernel-HyperOS-Tech
          path: ${{ env.PACK_NAME }}
          compression-level: 0
