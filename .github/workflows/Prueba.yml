name: Xiaomi 11U — Prueba HyperOS

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVICE_NAME: "xiaomi_11U"
  DEVICE_CODENAME: "star"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  # Declaración completa de herramientas LLVM para evitar errores 127 de llvm-ar/nm/etc.
  EXTRA_CMDS: 'LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 EXTRA_CFLAGS="-Wno-unused-function -Wno-frame-larger-than"'

  KERNEL_SOURCE: "https://github.com/joel27/android_kernel_xiaomi_sm8350-hyperos.git"
  KERNEL_BRANCH: "dynamic"

  CLANG_SOURCE: "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/star_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: "https://github.com/tiann/KernelSU"
  KERNELSU_BRANCH: "main"

  KERNELSU_AUTO_GET: "false"   # Mantiene desactivada la descarga externa y respeta tu submódulo
  KERNELSU_AUTO_FORK: "bakasu"

  SUSFS_ENABLE: true
  SUSFS_FIXED: true

  NOMOUNT_ENABLE: "true"

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "Kernel-HyperOS-TechMaster"

  PYTHON_VERSION: "3"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "joel27/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: "mi11_evox_a16"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "true"
  
  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/star_QGKI.config,vendor/xiaomi_QGKI.config"
  
  FREE_MORE_SPACE: "false"

  # --- Compilación (usado por el paso "Build Process") ---
  LITE_BUILD: "true"      # sin LTO/CFI (más rápido y como tu config MIUI)
  REQUIRE_KSU: "true"     # "false" para permitir compilar sin KernelSU
  # KernelSU (BakaSU) en modo SUSFS; sin esto BakaSU toma hooks de tracepoint y corta en GKI 1.0
  KSU_OPTS: >-
    -e KSU -d KSU_TRACEPOINT_HOOK
    -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT
    -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP
    -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
    -e KSU_SUSFS_ENABLE_LOG
  KCFLAGS_EXTRA: >-
    -Wno-error -Wno-frame-larger-than -Wno-strict-prototypes -Wno-align-mismatch
    -Wno-unused-function -Wno-unused-variable -Wno-unused-result -Wno-unused-label
    -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter
    -Wno-declaration-after-statement -Wno-sometimes-uninitialized -Wno-misleading-indentation
    -Wno-fortify-source -Wno-macro-redefined

jobs:
  build-kernel:
    name: Xiaomi11U (HyperOS Modern)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      # El paso anterior tomaba el primer ld.lld de todo el disco: caía en el wrapper de Rust
      # (~/.rustup/.../gcc-ld/ld.lld), que está solo en su carpeta, y make fallaba con
      # "llvm-ar: not found" (Error 127). Ahora se exige una carpeta bin con el toolchain COMPLETO.
      - name: 🛠️ Localizar Clang completo y exportarlo al PATH
        shell: bash
        run: |
          CLANG_BIN=""
          while IFS= read -r c; do
            d=$(dirname "$c")
            ok=1
            for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
              if [ ! -x "$d/$t" ]; then ok=0; break; fi
            done
            if [ "$ok" = 1 ] && "$d/clang" --version >/dev/null 2>&1; then CLANG_BIN="$d"; break; fi
          done < <(find "$GITHUB_WORKSPACE" "$HOME" -maxdepth 6 -path '*/bin/clang' 2>/dev/null)

          if [ -z "$CLANG_BIN" ]; then
            echo "::error::No encontré una carpeta bin con clang + ld.lld + llvm-ar/nm/objcopy/objdump/strip"
            echo "ld.lld encontrados:";   find "$GITHUB_WORKSPACE" "$HOME" -maxdepth 6 -name 'ld.lld'  2>/dev/null | head -n 10 || true
            echo "llvm-ar encontrados:";  find "$GITHUB_WORKSPACE" "$HOME" -maxdepth 6 -name 'llvm-ar' 2>/dev/null | head -n 10 || true
            exit 1
          fi
          echo "✅ Toolchain en: $CLANG_BIN"
          "$CLANG_BIN/clang" --version > /tmp/clang.ver 2>&1
          head -n1 /tmp/clang.ver
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: 🩹 Preparar defconfig
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          DEF="arch/arm64/configs/${DEFCONFIG_NAME}"
          if [ ! -f "$DEF" ]; then
            echo "::error::No existe $DEF"
            echo "Defconfigs 'star' que sí hay en el repo:"
            find arch/arm64/configs -iname '*star*' | sed 's|^arch/arm64/configs/||'
            exit 1
          fi
          if grep -qP '^[^\x00-\x7F]+(?=CONFIG_)' "$DEF"; then
            echo "::warning::$DEFCONFIG_NAME tiene caracteres raros antes de CONFIG_ (p. ej. un '（'); los quito en CI, corrígelo también en el repo"
            perl -pi -e 's/^[^\x00-\x7F]+(?=CONFIG_)//' "$DEF"
          fi
          if grep -qE '^CONFIG_[A-Za-z0-9_]+ is not set$' "$DEF"; then
            echo "::warning::$DEFCONFIG_NAME tiene líneas 'is not set' sin '# '; las corrijo en CI"
            sed -i -E 's/^(CONFIG_[A-Za-z0-9_]+) is not set$/# \1 is not set/' "$DEF"
          fi
          # ¿Fuentes rotas (#if/#endif descuadrados)? Avisa antes de gastar una compilación entera
          for f in fs/notify/fdinfo.c kernel/kallsyms.c fs/proc/task_mmu.c fs/namespace.c fs/proc_namespace.c \
                   fs/proc/base.c fs/readdir.c fs/stat.c fs/statfs.c fs/exec.c fs/open.c fs/namei.c kernel/sys.c; do
            [ -f "$f" ] || continue
            o=$(grep -cE '^[[:space:]]*#[[:space:]]*(if|ifdef|ifndef)([[:space:]]|\()' "$f" || true)
            e=$(grep -cE '^[[:space:]]*#[[:space:]]*endif' "$f" || true)
            if [ "$o" != "$e" ]; then
              echo "::warning::$f tiene $o #if y $e #endif: el archivo viene roto en el repo"
            fi
          done

      - name: 🔧 Símbolos globales de SELinux (KernelSU)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          # selinuxfs.c (my_write_context, my_sel_open_handle_status) usa fake_state y ksu_selinux_status_lock como
          # símbolos externos, pero en el BakaSU de upstream están "static" en selinux_hide.c (tu workflow BakaSU los
          # volvía globales con sed). Resultado: "ld.lld: error: undefined symbol: fake_state" al enlazar vmlinux.
          # Paso idempotente: quita el "static" y, solo si el símbolo no existe en KernelSU, lo define.
          echo "--- selinuxfs.c: referencias a los símbolos ---"
          grep -n -E 'fake_state|ksu_selinux_status_lock' security/selinux/selinuxfs.c | head -n 12 || true

          HIDE=$(find -L KernelSU drivers/kernelsu -name selinux_hide.c -print -quit 2>/dev/null || true)
          echo "selinux_hide.c: ${HIDE:-(no existe)}"

          KSU_FILES=""
          for d in KernelSU drivers/kernelsu; do
            if [ -d "$d" ]; then
              KSU_FILES="$KSU_FILES $(grep -rlE '\b(fake_state|ksu_selinux_status_lock)\b' --include='*.c' "$d" 2>/dev/null || true)"
            fi
          done
          KSU_FILES=$(for f in $KSU_FILES; do readlink -f "$f"; done | sort -u)

          # 1) quitar "static" de las declaraciones de los dos símbolos
          for f in $KSU_FILES; do
            if grep -qE '^[[:space:]]*static[[:space:]][^;=(]*\b(fake_state|ksu_selinux_status_lock)\b' "$f"; then
              echo "  quitando 'static' en ${f#$PWD/}"
              sed -i -E 's/^([[:space:]]*)static[[:space:]]+([^;=(]*\b(fake_state|ksu_selinux_status_lock)\b)/\1\2/' "$f"
            fi
          done

          # 2) ¿quedó cada símbolo definido (global) en algún .c de KernelSU?
          have_fake=0; have_lock=0
          for f in $KSU_FILES; do
            if grep -qE '^struct[[:space:]]+selinux_state[[:space:]]+fake_state\b' "$f"; then have_fake=1; fi
            if grep -qE '^struct[[:space:]]+mutex[[:space:]]*\*[[:space:]]*ksu_selinux_status_lock\b' "$f"; then have_lock=1; fi
          done

          inject() {   # uso: inject "<línea C>"  (la inserta tras el último #include de selinux_hide.c)
            [ -n "$HIDE" ] || return 1
            last=$(grep -n '^#include' "$HIDE" | tail -n1 | cut -d: -f1 || true)
            last=${last:-1}
            awk -v n="$last" -v add="$1" '{print} NR==n{print add}' "$HIDE" > "$HIDE.tmp" && mv "$HIDE.tmp" "$HIDE"
          }
          if [ "$have_fake" = 0 ]; then
            if inject "struct selinux_state fake_state;"; then echo "  + definido fake_state en $HIDE"
            else echo "::warning::fake_state no está definido en KernelSU y no hay selinux_hide.c donde ponerlo"; fi
          fi
          if [ "$have_lock" = 0 ]; then
            if inject "struct mutex *ksu_selinux_status_lock = NULL;"; then echo "  + definido ksu_selinux_status_lock en $HIDE"
            else echo "::warning::ksu_selinux_status_lock no está definido en KernelSU y no hay selinux_hide.c donde ponerlo"; fi
          fi

          echo "--- Definiciones/usos en KernelSU tras el arreglo ---"
          for f in $KSU_FILES $HIDE; do
            [ -f "$f" ] || continue
            grep -n -E '\b(fake_state|ksu_selinux_status_lock)\b' "$f" | head -n 6 | sed "s|^|  $(basename "$f"):|" || true
          done
          echo "--- ¿Se compila selinux_hide? (referencias en Makefile/Kbuild) ---"
          grep -rn 'selinux_hide' --include=Makefile --include=Kbuild --include='*.mk' KernelSU 2>/dev/null | head -n 5 || echo "  (sin referencias: si el enlace sigue fallando, selinux_hide.o no se está compilando)"

      - name: 🪛 Extra Kernel Options
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          echo "KBUILD_BUILD_TIMESTAMP=Fri Nov 14 08:26:51 UTC 2025" >> $GITHUB_ENV

      - name: 🚀 Build Process with Guaranteed Log Generation
        id: build_step
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          export PATH="$CLANG_BIN:$PATH"
          export KBUILD_BUILD_TIMESTAMP="Fri Nov 14 08:26:51 UTC 2025"

          set +e
          (
            set -eo pipefail
            MAKE_VARS=(ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy
                       OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu-
                       CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
                       KCFLAGS="$KCFLAGS_EXTRA")
            echo "clang: $(command -v clang) | llvm-ar: $(command -v llvm-ar)"

            # --- Configuración ---
            make O=out "${MAKE_VARS[@]}" "$DEFCONFIG_NAME"
            # Sin instalación de cabeceras UAPI (daba "No rule to make target ../scripts/Makefile.build")
            scripts/config --file out/.config -d HEADERS_INSTALL -d UAPI_HEADER_TEST
            # KernelSU + SUSFS (el defconfig no trae estas opciones y BakaSU toma hooks de tracepoint)
            scripts/config --file out/.config $KSU_OPTS
            if [ "$LITE_BUILD" = "true" ]; then
              echo "Modo ligero: LTO y CFI desactivados"
              scripts/config --file out/.config -e LTO_NONE -d LTO_CLANG -d CFI_CLANG -d CFI_PERMISSIVE
            fi
            make O=out "${MAKE_VARS[@]}" olddefconfig
            cp out/.config dotconfig.txt

            echo "--- KernelSU / SUSFS ---"
            grep -E '^(# )?CONFIG_KSU' out/.config || true
            # Válido: KSU activo, sin hooks de tracepoint, y con SUSFS u hooks manuales
            if ! grep -qE '^CONFIG_KSU=[ym]$' out/.config \
               || grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' out/.config \
               || ! grep -qE '^CONFIG_KSU_(SUSFS|MANUAL_HOOK)=y$' out/.config; then
              echo "::warning::KernelSU mal configurado: hace falta CONFIG_KSU=y, CONFIG_KSU_SUSFS=y (o KSU_MANUAL_HOOK=y) y sin KSU_TRACEPOINT_HOOK"
              if [ "$REQUIRE_KSU" = "true" ]; then
                echo "::error::KernelSU sin SUSFS/hooks manuales o con hooks de tracepoint (REQUIRE_KSU=true)"
                exit 1
              fi
            fi

            # --- Compilación (-k: sigue y lista todos los errores; solo la Image, que es lo que se empaqueta) ---
            echo "make -k -j$(nproc) O=out Image"
            rc=0
            make -k -j"$(nproc)" O=out "${MAKE_VARS[@]}" Image || rc=$?
            exit "$rc"
          ) 2>&1 | tee build_full.log
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -eq 0 ] && [ -s out/arch/arm64/boot/Image ]; then
            echo "BUILD_STATUS=SUCCESS" >> "$GITHUB_ENV"
            echo "✅ Compilación exitosa."
          else
            echo "BUILD_STATUS=FAILED" >> "$GITHUB_ENV"
            errs=$(grep -n -i -E 'error:|\*\*\* |undefined (reference|symbol)|fatal error|ld\.lld: error|clang(-[0-9]+)?: error|version .* not found|: not found|no such file or directory|permission denied' build_full.log | head -n 40 || true)
            echo "--------------------------------------------------------"
            echo "❌ ¡LA COMPILACIÓN HA FALLADO! RESUMEN DE ERRORES:"
            echo "--------------------------------------------------------"
            echo "$errs"
            echo "--------------------------------------------------------"
            {
              echo "### ❌ Falló la compilación de HyperOS"
              echo '```'
              echo "$errs"
              echo '```'
              echo "Log completo y .config en el artifact **Kernel-Compilation-Full-Log**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 📦 Package AnyKernel3 Flash Zip
        if: env.PACK_METHOD == 'AnyKernel3' && env.BUILD_STATUS != 'FAILED'
        shell: bash
        run: |
          set -uo pipefail
          TIME=$(date +"%Y%m%d%H%M%S")
          KERNEL_DIR="${GITHUB_WORKSPACE}/device_kernel"
          TMP_DIR="${KERNEL_DIR}/tmp"
          IMG_PATH="${KERNEL_DIR}/out/arch/arm64/boot/Image"
          cd "${KERNEL_DIR}"
          if [[ ! -f "${IMG_PATH}" ]]; then
            echo "::error::❌ Build failed, Image not found"
            exit 1
          fi
          IMG_SIZE=$(du -h "${IMG_PATH}" | awk '{print $1}')
          echo "✅ Kernel image detected | Size: ${IMG_SIZE}"
          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"

          AK3_DIR="${KERNEL_DIR}/AnyKernel3"
          if [[ ! -d "${AK3_DIR}" ]]; then
            echo "::error::❌ AnyKernel3 not found in ${AK3_DIR}"
            exit 1
          fi
          if [[ -d "${AK3_DIR}" ]]; then
            curl -fsSL --retry 3 https://raw.githubusercontent.com/joel27/NonGKI_Kernel_Build_2nd/mainline/Patches/anykernel.sh -o "${AK3_DIR}/anykernel.sh"
            chmod +x "${AK3_DIR}/anykernel.sh"
            sed -i \
              -e 's/^name=.*/name="11U-Bakasu"/' \
              -e 's/^do\.devicecheck=.*/do.devicecheck=0/' \
              -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1/' \
              -e 's/^BLOCK=.*/BLOCK=boot/' \
              "${AK3_DIR}/anykernel.sh"
          fi

          cp -v "${IMG_PATH}" "${TMP_DIR}/Image"
          [[ -d "${AK3_DIR}" ]] && cp -rp "${AK3_DIR}"/* "${TMP_DIR}/"
          cd "${TMP_DIR}"
          7za a -tzip -mx9 -mmt=on package.zip ./* >/dev/null
          cd "${GITHUB_WORKSPACE}"

          FINAL_ZIP="Kernel-HyperOS-TechMaster-11U-${TIME}.zip"
          cp -fp "${TMP_DIR}/package.zip" "${FINAL_ZIP}"
          echo "PACK_NAME=${FINAL_ZIP}" >> $GITHUB_ENV
          echo "✅ Zip generado: ${FINAL_ZIP}"
          rm -rf "${TMP_DIR}"

      - name: 📝 Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Compilation-Full-Log
          path: |
            device_kernel/build_full.log
            device_kernel/dotconfig.txt
          if-no-files-found: warn

      - name: 🚀 Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        if: env.PACK_METHOD == 'AnyKernel3' && env.BUILD_STATUS != 'FAILED'
        with:
          name: Star-Kernel-HyperOS-Tech
          path: ${{ env.PACK_NAME }}
          compression-level: 0
